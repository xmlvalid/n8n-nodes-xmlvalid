# Publishes n8n-nodes-xmlvalid to npm, with provenance, when an X.Y.Z tag is pushed.
# n8n verifies community nodes only when they are published from GitHub Actions with provenance.
#
# One-time setup, with Trusted Publishing (no token stored anywhere):
#   npmjs.com → n8n-nodes-xmlvalid → Settings → Trusted Publisher → GitHub Actions:
#     Organization or user: xmlvalid    Repository: n8n-nodes-xmlvalid
#     Workflow filename: publish.yml    Environment: (empty)
#     Permissions: npm stage publish
# A run stages the version; it goes live once approved with 2FA on npmjs.com (Staged Packages) or with `npm stage approve <stage-id>`. `npm stage` needs npm 12.
#
# Releasing: bump "version" in package.json and CHANGELOG.md, commit, then
#   git tag 1.2.1 && git push origin 1.2.1
# Tags have no "v", as `n8n-node release` made them.

name: Publish

on:
  push:
    tags: ['*.*.*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
      - name: The tag matches the version
        run: test "$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # prepublishOnly (n8n-node prerelease) stops any publish without RELEASE_MODE, as `n8n-node release` sets it.
      - run: npx -y npm@12.2.0 stage publish --provenance --access public
        env:
          RELEASE_MODE: 'true'
